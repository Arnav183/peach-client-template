# Fly.io config for Peach Stack client instance
# Deploy: fly launch --name peach-CLIENTNAME --no-deploy

app = "peach-client-REPLACE_ME"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "client_data"
  destination = "/data"
